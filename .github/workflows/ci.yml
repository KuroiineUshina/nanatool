name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit tests
        run: node --test tests/*.test.js
      - name: Validate release package
        shell: pwsh
        run: ./scripts/build-release.ps1 -OutputDirectory "$env:RUNNER_TEMP/nanatool-dist"
