<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>갤러리아 · 나나툴</title>
    <link rel="stylesheet" href="assets/pretendard-local.css">
    <link rel="stylesheet" href="gallery.css">
    <link rel="stylesheet" href="assets/service-header.css">
  </head>
  <body>
    <header class="service-topbar">
      <div class="service-brand">
        <span class="service-brand-mark" aria-hidden="true"></span>
        <div>
          <p>NANA TOOL</p>
          <h1>갤러리아</h1>
        </div>
      </div>
      <div class="service-topbar-copy">
        <strong>내가 모은 이미지</strong>
        <span>이미지 원본은 이 브라우저의 나나툴 보관함에만 저장됩니다.</span>
      </div>
      <div class="service-topbar-actions">
        <a class="service-topbar-link service-update-link" data-release-update hidden></a>
        <label class="service-theme-control">
          <span class="sr-only">테마</span>
          <select id="theme-mode" aria-label="테마">
            <option value="system">시스템 설정</option>
            <option value="light">라이트</option>
            <option value="dark">다크</option>
          </select>
        </label>
        <a class="service-topbar-link" href="options.html">전체 설정</a>
      </div>
    </header>

    <main class="gallery-shell">
      <aside class="folder-pane" aria-label="이미지 폴더">
        <div class="pane-heading">
          <div>
            <p class="eyebrow">COLLECTIONS</p>
            <h2>폴더</h2>
          </div>
          <span id="total-count" class="count-badge">0</span>
        </div>

        <nav id="folder-list" class="folder-list" aria-label="이미지 폴더 목록"></nav>

        <form id="folder-form" class="folder-form">
          <label for="new-folder-name">새 폴더</label>
          <div>
            <input
              id="new-folder-name"
              type="text"
              maxlength="40"
              autocomplete="off"
              placeholder="폴더 이름"
              required
            >
            <button type="submit">추가</button>
          </div>
        </form>

        <p class="drop-help">이미지를 폴더 위로 끌어 놓으면 바로 이동합니다.</p>
      </aside>

      <section class="collection-pane" aria-labelledby="collection-title">
        <div class="collection-toolbar">
          <div>
            <p class="eyebrow">LOCAL IMAGE BOOKMARKS</p>
            <h2 id="collection-title">모든 이미지</h2>
            <p id="collection-summary" class="collection-summary">불러오는 중…</p>
          </div>
          <label class="search-field">
            <span class="sr-only">이미지 북마크 검색</span>
            <input
              id="image-search"
              type="search"
              autocomplete="off"
              placeholder="제목·갤러리·글번호 검색"
            >
          </label>
        </div>

        <div id="gallery-grid" class="image-grid" aria-live="polite"></div>
        <div id="gallery-empty" class="empty-state" hidden>
          <span aria-hidden="true">◇</span>
          <strong>이 폴더에는 이미지가 없습니다.</strong>
          <p>디시 글 본문의 ‘이미지 북마크’ 버튼으로 이미지를 모아보세요.</p>
        </div>
      </section>
    </main>

    <dialog id="image-viewer" class="image-viewer" aria-labelledby="viewer-title">
      <button id="viewer-close" class="viewer-close" type="button" aria-label="닫기">×</button>
      <div class="viewer-stage">
        <img id="viewer-image" alt="">
        <p id="viewer-missing" class="viewer-missing" hidden>
          저장된 이미지 파일을 찾지 못했습니다.
        </p>
      </div>
      <aside class="viewer-info">
        <p class="eyebrow">IMAGE BOOKMARK</p>
        <h2 id="viewer-title" class="sr-only"></h2>
        <p id="viewer-origin" class="viewer-origin"></p>
        <dl class="viewer-meta">
          <div><dt>크기</dt><dd id="viewer-dimensions">—</dd></div>
          <div><dt>파일</dt><dd id="viewer-size">—</dd></div>
          <div><dt>저장</dt><dd id="viewer-date">—</dd></div>
        </dl>
        <label class="viewer-folder-field">
          <span>폴더</span>
          <select id="viewer-folder"></select>
        </label>
        <div class="viewer-actions">
          <a id="viewer-post-link" href="#" target="_blank" rel="noreferrer">원문 보기</a>
          <button id="viewer-delete" type="button">북마크 삭제</button>
        </div>
      </aside>
    </dialog>

    <p id="toast" class="toast" role="status" aria-live="polite"></p>

    <script src="core.js"></script>
    <script src="image-store.js"></script>
    <script src="assets/release-update.js"></script>
    <script src="gallery.js"></script>
  </body>
</html>
